<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#gemGrad)" stroke-width="4" opacity="0.4" />

  <!-- Center Diamond / Gem Graphic -->
  <g transform="translate(128, 128)">
    <polygon points="128,20 236,90 128,236 20,90" fill="url(#gemGrad)" />
    <!-- Gem facets -->
    <polygon points="128,20 180,90 128,236" fill="#ffffff" opacity="0.2" />
    <polygon points="128,20 76,90 128,236" fill="#000000" opacity="0.15" />
    <line x1="20" y1="90" x2="236" y2="90" stroke="#ffffff" stroke-width="3" opacity="0.4" />
    <line x1="76" y1="90" x2="128" y2="20" stroke="#ffffff" stroke-width="3" opacity="0.4" />
    <line x1="180" y1="90" x2="128" y2="20" stroke="#ffffff" stroke-width="3" opacity="0.4" />
  </g>
</svg>
